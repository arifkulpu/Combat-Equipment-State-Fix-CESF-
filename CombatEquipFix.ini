; ============================================================
;  Combat Equipment State Fix — Configuration File
;  Place this file alongside the DLL:
;  Data/SKSE/Plugins/CombatEquipFix.ini
; ============================================================

[General]

; Fix for NPCs cycling weapons (sheathing/drawing) BEFORE combat starts.
; Set to 1 to ENABLE (default), 0 to DISABLE.
bFixPreCombatLoop=1

; Number of rapid sheathings within the detection window that triggers the cooldown.
; Default: 2
iPreCombatThreshold=2

; Time window (seconds) in which sheathings are counted.
; Default: 6
iPreCombatWindowSec=6

; How long (seconds) to block further cycling once a loop is detected.
; Default: 8
iPreCombatBlockSec=8


; Fix for NPCs stuck with their weapon drawn but not attacking or sheathing.
; Set to 1 to ENABLE (default), 0 to DISABLE.
bFixStuckWeapon=1

; How many seconds the NPC must be out-of-combat with weapon drawn before
; it is considered stuck and force-sheathed.
; Default: 20
iStuckWeaponTimeoutSec=20

; Only NPCs within this distance (Skyrim units) of the player are scanned.
; NPCs outside this range are skipped — they are unloaded and will reset naturally.
; 3000 units ≈ 60 meters (roughly the exterior detection radius).
; Default: 3000
iStuckWeaponCheckRadius=3000
