; ============================================================
;  Combat Equipment State Fix — Configuration File
;  Place this file alongside the DLL:
;  Data/SKSE/Plugins/CombatEquipFix.ini
; ============================================================

[General]

; Fix for NPCs cycling weapons (sheathing/drawing) BEFORE combat starts.
; Some users report NPCs repeatedly sheathing and redrawing weapons while
; idle or alert, even when no fight has begun.
;
; This fix detects the rapid sheathe loop and temporarily blocks further
; sheathing for the offending NPC.
;
; Set to 1 to ENABLE, 0 to DISABLE (default).
bFixPreCombatLoop=0

; --- Advanced Tuning (change only if the default behavior feels wrong) ---

; Number of sheathings within the detection window that triggers the block.
; Lower = more aggressive detection.  Default: 3
iPreCombatThreshold=3

; Time window (seconds) in which sheathings are counted.
; Default: 5
iPreCombatWindowSec=5

; How long (seconds) to block further sheathings after a loop is detected.
; Default: 10
iPreCombatBlockSec=10
