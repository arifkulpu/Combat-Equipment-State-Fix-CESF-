; ============================================================
;  Combat Equipment State Fix — Configuration File
;  Place this file alongside the DLL:
;  Data/SKSE/Plugins/CombatEquipFix.ini
; ============================================================

[General]

; Followers and commanded actors are completely ignored by this plugin.
; Highly recommended to prevent interfering with follower behavior/packages.
; 1 = Enabled (default), 0 = Disabled
bSkipTeammates=1

; Fix for NPCs repeatedly cycling weapons (sheathing/drawing) outside combat.
; Note: In v1.6.0+, sheathing is NEVER blocked; instead, re-drawing is put on cooldown.
; 1 = Enabled (default), 0 = Disabled
bFixPreCombatLoop=1

; Number of rapid draw->sheathe cycles within the window that triggers the cooldown.
; Default: 3
iPreCombatThreshold=3

; Time window (seconds) in which cycles are counted.
; Default: 6
iPreCombatWindowSec=6

; How long (seconds) re-drawing is blocked once a loop is detected.
; Default: 5
iPreCombatBlockSec=5


; Fix for NPCs sheathing and re-drawing weapons mid-combat.
; Blocks at most ONE too-fast sheathe right after drawing (allows weapon swapping).
; 1 = Enabled (default), 0 = Disabled
bFixCombatLoop=1


; Fix for NPCs stuck with their weapon drawn outside combat without attacking.
; Force-sheathes the weapon after the timeout.
; 1 = Enabled (default), 0 = Disabled
bFixStuckWeapon=1

; How many seconds an NPC must stay out-of-combat with weapon drawn before force-sheathing.
; Default: 30
iStuckWeaponTimeoutSec=30

; Only NPCs within this distance (Skyrim units) of the player are scanned.
; 3000 units ≈ 60 meters.
; Default: 3000
iStuckWeaponCheckRadius=3000
